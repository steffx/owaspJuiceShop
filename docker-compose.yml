# OWASP Juice Shop as the system under test.
# The image is intentionally vulnerable and is meant to be run locally or in CI for testing only.
services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=unsafe
    # Readiness is polled from the host by scripts/wait-for-juice.js (npm run juice:up),
    # since the image ships no wget/curl for an in-container healthcheck.
